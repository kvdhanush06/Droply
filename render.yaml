services:
  - type: web
    name: droply
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "24"

      - key: TRUST_PROXY
        value: "true"

      - key: ALLOWED_ORIGINS
        sync: false

      - key: ROOM_TTL_SECONDS
        value: "1800"

      - key: MAX_ROOM_PEERS
        value: "4"

      - key: MAX_CONNECTIONS
        value: "100"

      - key: MAX_ROOMS
        value: "500"

      - key: STUN_SERVERS
        value: stun:stun.l.google.com:19302

      - key: TURN_URLS
        sync: false

      - key: TURN_USERNAME
        sync: false

      - key: TURN_CREDENTIAL
        sync: false
